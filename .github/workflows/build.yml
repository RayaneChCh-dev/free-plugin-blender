name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m compileall -q free_plugin_blender
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: free_plugin_blender
          path: dist/*.zip
