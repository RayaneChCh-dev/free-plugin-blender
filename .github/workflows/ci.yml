name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.3"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q ruff==0.14.0
      - run: ruff check .
      - name: Catalog and schema files are valid JSON
        run: python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('free_plugin_blender/data/**/*.json', recursive=True)]"

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - run: python3 -m pytest -q

  blender-tests:
    name: blender-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
      - name: Build, validate, install in a throwaway profile, run tests/blender
        run: python3 scripts/run_blender_tests.py --blender "$BLENDER"
      - uses: actions/upload-artifact@v4
        with:
          name: free_plugin_blender
          path: dist/*.zip
