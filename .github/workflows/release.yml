name: Release

# Push a tag vX.Y.Z on main (matching blender_manifest.toml) to publish a GitHub release with the zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.2.3"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the manifest version and is on main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' free_plugin_blender/blender_manifest.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
      - name: Test, build and validate
        run: python3 scripts/run_blender_tests.py --blender "$BLENDER"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/free_plugin_blender-*.zip --title "$GITHUB_REF_NAME" --generate-notes
